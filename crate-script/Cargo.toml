[package]
name = "lamprey-script"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true

[dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
common = { workspace = true, features = ["utoipa", "validator"] }
cpu-time = "1.0.0"
dashmap = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
nanoid = "0.5.0"
rquickjs = { version = "0.14.0", features = ["futures", "loader", "macro", "parallel"], optional = true }
rquickjs-serde = "0.8.0"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "time"] }
tracing = { workspace = true }
url = { workspace = true }
validator = { workspace = true }
wasmtime = { version = "50.0.1", optional = true }

[features]
# default = ["javascript"]
default = ["javascript", "wasm"]
javascript = ["dep:rquickjs"]
wasm = ["dep:wasmtime"]
