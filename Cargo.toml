[workspace]
resolver = "3"
members = [
  "scanner-malware",
  "crate-*",
  "macros-components",
  "kerosene",
  "kerosene-core",
  "kerosene-rest",
  "kerosene-sync",
  "kerosene-services",
  "lamprey", "kerosene-automod", "kerosene-zygote", "scanner-nsfw",
]

[workspace.package]
version = "0.1.5"
edition = "2024"
authors = ["tezlm"]
description = "yet another chat thing?"
license = "MIT OR Apache-2.0"
repository = "https://git.celery.eu.org/lamprey/lamprey"
keywords = ["lamprey"]

[workspace.dependencies]
anyhow = "1.0.104"
async-nats = "0.46.0"
async-tempfile = "0.7.0"
async-trait = "0.1.92"
axum = "0.8.9"
axum-extra = "0.10.3"
base32 = "0.5.1"
base64 = "0.22.1"
bitflags = "2.13.2"
blake3 = "1.8.6"
bytes = "1.12.1"
chrono = "0.4.45"
chrono-tz = "0.10.4"
clap = "4.6.6"
constant_time_eq = "0.4.2"
crc32fast = "1.5.2"
csscolorparser = "0.7.2"
darling = "0.23.0"
dashmap = "6.2.1"
decancer = "3.3.3"
dotenvy = "0.15.7"
ece = "2.3.1"
ed25519-dalek = "2.2.0"
figment = "0.10.19"
flate2 = "1.1.9"
futures = "0.3.34"
futures-util = "0.3.34"
headers = "0.4.1"
http = "1.5.0"
httpdate = "1.0.3"
im = "15.1.0"
image = "0.25.10"
infer = "0.22.0"
ipnet = "2.12.2"
jsonwebkey = "0.4.0"
jsonwebtoken = "10.4.0"
kameo = "0.19.2"
lettre = { version = "0.11.23", default-features = false }
macrotest = "1"
maxminddb = "0.28.1"
mediatype = "0.20.0"
moka = "0.12.16"
multer = "3.1.0"
once_cell = "1.21.4"
opendal = "0.54.1"
opentelemetry = "0.33.1"
opentelemetry-otlp = { version = "0.33.1", default-features = false }
opentelemetry_sdk = "0.33.1"
p256 = "0.13.2"
percent-encoding = "2.3.2"
postcard = "1.1.3"
proc-macro-crate = "3.5.0"
proc-macro2 = "1.0"
quinn = "0.11.12"
quote = "1.0"
rcgen = "0.14.9"
regex = "1.13.1"
reqwest = { version = "0.12.28", default-features = false }
rmp-serde = "1.3.1"
rrule = "0.14.0"
rust-argon2 = "3.0.0"
rustls = { version = "0.23.43", default-features = false }
serde = "1.0.229"
serde_json = "1.0.151"
serde_path_to_error = "0.1.20"
serde_urlencoded = "0.7.1"
serde-wasm-bindgen = "0.6.5"
serenity = "0.12.5"
sha2 = "0.10.9"
slotmap = "1.1.1"
sqlx = "0.8.6"
stunclient = "0.4.2"
str0m = "0.20.0"
subtle = "2.6.1"
symphonia = "0.5.5"
syn = "2.0"
systemstat = "0.2.7"
tantivy = "0.26.1"
thiserror = "2.0.21"
time = "0.3.55"
tokio = "1.53.2"
tokio-stream = "0.1.19"
tokio-tungstenite = "0.27.0"
tokio-util = "0.7.20"
totp-rs = "5.7.2"
tower-http = "0.6.11"
tracing = "0.1.44"
tracing-opentelemetry = "0.34.0"
tracing-subscriber = "0.3.23"
tsify = "0.5.6"
unicode-properties = "0.1.4"
unicode-segmentation = "1.13.3"
url = "2.5.8"
utoipa = "5.5.0"
utoipa-axum = "0.2.0"
uuid = "1.27.0"
validator = "0.20.0"
wasm-bindgen = "0.2.127"
wtransport = "0.7.2"
yrs = "0.25.0"

# local crates (aliases keyed as the dependency is named in members)
common = { package = "lamprey-common", version = "0.1.5", path = "crate-common" }
kerosene-core = { version = "0.1.5", path = "kerosene-core" }
kerosene-rest = { version = "0.1.5", path = "kerosene-rest" }
kerosene-search = { version = "0.1.5", path = "kerosene-search" }
kerosene-services = { version = "0.1.5", path = "kerosene-services" }
kerosene-sync = { version = "0.1.5", path = "kerosene-sync" }
lamprey = { package = "lamprey-common", version = "0.1.5", path = "crate-common" }
lamprey-backend-core = { version = "0.1.5", path = "crate-backend-core" }
lamprey-backend-data-postgres = { version = "0.1.5", path = "crate-backend-data-postgres" }
lamprey-common = { version = "0.1.5", path = "crate-common" }
lamprey-macros = { version = "0.1.5", path = "crate-macros" }
lamprey-markdown = { version = "0.1.5", path = "crate-markdown" }
lamprey-script = { version = "0.1.5", path = "crate-script" }
lamprey-sdk = { version = "0.1.5", path = "crate-sdk" }
lamprey-unfurl = { version = "0.1.5", path = "crate-unfurl" }
sdk = { package = "lamprey-sdk", version = "0.1.5", path = "crate-sdk" }

[profile.dev]
opt-level = 0

[profile.dev.package]
sqlx-macros.opt-level = 3
async-trait.opt-level = 3
image.opt-level = 3
lamprey-macros.opt-level = 3

[workspace.metadata.crane]
name = "lamprey"
