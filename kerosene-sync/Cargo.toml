[package]
name = "kerosene-sync"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws"] }
flate2 = "1.1.9"
futures = "0.3.34"
futures-util = "0.3.34"
kerosene-core = { version = "0.1.1", path = "../kerosene-core" }
lamprey = { package = "lamprey-common", version = "0.1.0", path = "../crate-common", features = ["utoipa", "validator"] }
lamprey-backend-core = { path = "../crate-backend-core" }
lamprey-macros = { path = "../crate-macros" }
rmp-serde = "1.3.1"
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt", "macros"] }
tracing = "0.1.44"
yrs = { version = "0.25.0", features = ["sync"] }
