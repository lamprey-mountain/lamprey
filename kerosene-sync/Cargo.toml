[package]
name = "kerosene-sync"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true

[dependencies]
async-compression = { version = "0.4.52", features = ["deflate", "tokio"] }
async-trait = { workspace = true }
axum = { workspace = true, features = ["ws"] }
bytes = { workspace = true, features = ["serde"] }
flate2 = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }
kerosene-core = { workspace = true }
lamprey = { workspace = true, features = ["utoipa", "validator"] }
lamprey-macros = { workspace = true }
rmp-serde = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }
tokio-util = { workspace = true, features = ["codec"] }
tracing = { workspace = true }
wtransport = { workspace = true, optional = true }
yrs = { workspace = true, features = ["sync"] }

[features]
default = []
webtransport = ["dep:wtransport"]
