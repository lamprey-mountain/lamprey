[package]
name = "lamprey-search"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true

[dependencies]
bytes = "1.12.1"
common = { package = "lamprey-common", version = "0.1.0", path = "../crate-common", features = ["utoipa", "validator"] }
dashmap = "6.2.1"
lamprey-markdown = { version = "0.1", path = "../crate-markdown" }
once_cell = "1.21.4"
opendal = { version = "0.54.1", features = ["services-s3", "services-fs"] }
pastey = "0.2.3"
serde_json = "1.0.151"
tantivy = "0.26.1"
tokio = { version = "1.53.1", features = ["fs", "rt-multi-thread"] }
tracing = "0.1.44"
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.24.1", features = ["v7", "serde", "v4", "fast-rng", "macro-diagnostics"] }
