[package]
name = "lamprey-markdown"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# TODO: common refuses to compile without a random mishmash of features, i should clean up that code
anyhow = { version = "1.0.104", optional = true }
clap = { version = "4.6.6", features = ["derive"], optional = true }
lamprey-common = { path = "../crate-common", optional = true, default-features = false, features = ["validator", "serde", "utoipa", "ptr_box", "feat_interaction_reaction" ] }
logos = "0.16.1"
rowan = "0.16.1"
uuid = { version = "1.24.1", features = ["serde", "v7"] }
wasm-bindgen = { version = "0.2.127", optional = true }
serde = { version = "1.0.229", optional = true, features = ["derive"] }
serde-wasm-bindgen = { version = "0.6.5", optional = true }
tsify = { version = "0.5.6", optional = true, default-features = false, features = ["js"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1.24.1", features = ["serde", "v7", "js"] }
getrandom = { version = "0.4", features = ["wasm_js"] }

[features]
parallel = []
serde = ["dep:serde"]
default = ["dep:lamprey-common", "serde"]
wasm = ["dep:wasm-bindgen", "serde", "dep:serde-wasm-bindgen", "dep:tsify"]
bin = ["dep:clap", "dep:anyhow"]

[[bin]]
name = "lmd"
path = "src/bin/main.rs"
required-features = ["bin"]
