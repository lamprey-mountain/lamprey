[package]
name = "lamprey-markdown"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# TODO: common refuses to compile without a random mishmash of features, i should clean up that code
anyhow = { workspace = true, optional = true }
clap = { workspace = true, features = ["derive"], optional = true }
lamprey-common = { workspace = true, default-features = false, features = ["validator", "serde", "utoipa", "ptr_box", "feat_interaction_reaction" ], optional = true }
logos = "0.16.1"
rowan = "0.16.1"
url = { workspace = true }
uuid = { workspace = true, features = ["serde", "v7"] }
wasm-bindgen = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde-wasm-bindgen = { workspace = true, optional = true }
tsify = { workspace = true, default-features = false, features = ["js"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["serde", "v7", "js"] }
getrandom = { version = "0.4", features = ["wasm_js"] }

[features]
parallel = []
serde = ["dep:serde"]
default = ["dep:lamprey-common", "serde"]
wasm = ["dep:wasm-bindgen", "serde", "dep:serde-wasm-bindgen", "dep:tsify"]
bin = ["dep:clap", "dep:anyhow"]

[[bin]]
name = "lmd"
path = "src/bin/main.rs"
required-features = ["bin"]
