[package]
name = "lamprey-backend-data-postgres"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
build = "build.rs"

[build-dependencies]
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres"] }

[dependencies]
async-trait = "0.1.92"
common = { package = "lamprey-common", version = "0.1.0", path = "../crate-common" }
lamprey-backend-core = { version = "0.1.1", path = "../crate-backend-core" }
lamprey-hakari = { version = "0.1", path = "../crate-hakari" }
nanoid = "0.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "uuid", "time", "ipnetwork", "migrate"] }
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["serde"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
uuid = { version = "1.24.1", features = ["v7", "serde", "v4", "fast-rng", "macro-diagnostics"] }
