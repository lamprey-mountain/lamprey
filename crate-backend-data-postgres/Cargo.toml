[package]
name = "lamprey-backend-data-postgres"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
build = "build.rs"

[build-dependencies]
sqlx = { workspace = true, features = ["runtime-tokio", "postgres"] }

[dependencies]
async-trait = { workspace = true }
common = { workspace = true }
lamprey-backend-core = { workspace = true }
nanoid = "0.4.0"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "postgres", "uuid", "time", "ipnetwork", "migrate"] }
thiserror = { workspace = true }
time = { workspace = true, features = ["serde"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v7", "serde", "v4", "fast-rng", "macro-diagnostics"] }
