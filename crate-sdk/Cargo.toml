[package]
name = "lamprey-sdk"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
arc-swap = "1.9.2"
async-trait = { workspace = true }
bytes = { workspace = true }
common = { workspace = true }
dashmap = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }
headers = { workspace = true }
http = { workspace = true }
lru = "0.18.2"
parking_lot = "0.12.5"
reqwest = { workspace = true, features = ["rustls-tls-native-roots", "json", "stream"] }
rustls = { workspace = true, features = ["ring"] }
serde_json = { workspace = true }
str0m = { workspace = true, optional = true }
stunclient = { workspace = true, features = ["async"], optional = true }
symphonia = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "rt-multi-thread", "macros"] }
tokio-stream = { workspace = true, features = ["sync"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
wtransport = { workspace = true, optional = true }
yrs = { workspace = true, features = ["sync"], optional = true }

[features]
default = ["voice", "document", "std", "flumes", "cache", "webtransport"]
voice = ["dep:str0m", "dep:symphonia", "dep:stunclient"]
document = ["dep:yrs"]
flumes = []
cache = []
webtransport = ["dep:wtransport"]
std = [] # TODO: no_std support
