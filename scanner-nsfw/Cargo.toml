[package]
name = "scanner-nsfw"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true

[[bin]]
name = "scanner-nsfw"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true, features = ["macros"] }
clap = { workspace = true, features = ["derive"] }
figment = { workspace = true, features = ["toml", "env"] }
image = { workspace = true }
ndarray = "0.17.2"
ort = { version = "2.0.0-rc.14", default-features = false, features = ["std", "ndarray", "tracing", "api-27"] }
reqwest = { workspace = true, default-features = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tower-http = { workspace = true, features = ["trace", "cors"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }

[features]
download = ["dep:reqwest", "dep:sha2"]
