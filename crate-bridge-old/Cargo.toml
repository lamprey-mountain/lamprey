[package]
name = "lamprey-bridge-old"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true

[[bin]]
name = "bridge"
path = "src/main.rs"

[dependencies]
async-trait = { workspace = true }
dashmap = { workspace = true }
dotenvy = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true, features = ["rustls-tls-native-roots", "json"] }
rustls = { workspace = true, features = ["ring"] }
serde = { workspace = true }
serenity = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "uuid"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
common = { workspace = true }
uuid = { workspace = true }
sdk = { workspace = true }
time = { workspace = true, features = ["serde-human-readable", "macros"] }
anyhow = { workspace = true }
figment = { workspace = true, features = ["env", "toml"] }
opentelemetry-otlp = { workspace = true, features = ["grpc-tonic", "logs", "metrics", "trace"] }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["rt-tokio", "tokio"] }
tracing-opentelemetry = { workspace = true }
kameo = { workspace = true }
regex = { workspace = true }
once_cell = { workspace = true }
