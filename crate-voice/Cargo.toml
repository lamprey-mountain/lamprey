[package]
name = "lamprey-voice"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true

[[bin]]
name = "voice"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
common = { workspace = true }
dashmap = { workspace = true }
fastrand = "2.5.0"
figment = { workspace = true, features = ["env", "json", "toml"] }
futures = { workspace = true }
futures-util = { workspace = true }
lamprey-backend-core = { workspace = true }
num_cpus = "1.17.0"
opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true, features = ["grpc-tonic", "logs", "metrics", "trace"] }
opentelemetry_sdk = { workspace = true, features = ["rt-tokio", "tokio"] }
postcard = { workspace = true }
quinn = { workspace = true }
rand = "0.10.3"
rcgen = { workspace = true }
rustls = { workspace = true, default-features = true, features = ["ring"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
slotmap = { workspace = true }
smallvec = "1.16.5"
socket2 = { version = "0.6.5", features = ["all"] }
str0m = { workspace = true }
systemstat = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-stream = { workspace = true, features = ["sync"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
tokio-util = { workspace = true, features = ["time"] }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
url = { workspace = true }
