[package]
name = "lamprey-bot"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true

[[bin]]
name = "bot"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true, features = ["derive"] }
common = { workspace = true }
dotenvy = { workspace = true }
figment = { workspace = true, features = ["env", "toml"] }
futures = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true, features = ["rustls", "json"] }
rustls = { workspace = true, features = ["ring"] }
sdk = { workspace = true, features = ["voice"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite"] }
str0m = { workspace = true }
stunclient = { workspace = true }
symphonia = { workspace = true }
systemstat = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
tokio-util = { workspace = true, features = ["codec", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
url = { workspace = true }
