[package]
name = "lamprey-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
common = { workspace = true }
demand = "2.0.5"
dirs = "6.0.0"
figment = { workspace = true, features = ["env", "toml"] }
indicatif = { version = "0.18.6", features = ["tokio"] }
lamprey-backend = { version = "0.1.1", path = "../crate-backend" }
lamprey-backend-core = { workspace = true }
lamprey-sdk = { workspace = true }
lamprey-voice = { version = "0.1.1", path = "../crate-voice" }
serde = { workspace = true, features = ["derive"] }
strum = { version = "0.28.0", features = ["derive"] }
tokio = { workspace = true, features = ["macros"] }
toml = "1.1.4"
