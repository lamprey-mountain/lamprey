[package]
name = "lamprey-common"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22.1"
bitflags = { version = "2.13.1", features = ["serde"] }
bytes = { version = "1.12.1", features = ["serde"] }
ed25519-dalek = "2.2.0"
http = "1.5.0"
lamprey-macros = { version = "0.1", path = "../crate-macros" }
mediatype = { version = "0.20.0", features = ["serde"] }
pastey = "0.1.1"
percent-encoding = "2.3.2"
rand = "0.10.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.151", optional = true }
serde_urlencoded = "0.7.1"
str0m = { version = "0.20.0", optional = true }
strum = { version = "0.27.2", features = ["derive"] }
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting", "parsing", "serde"] }
unicode-properties = "0.1.4"
unicode-segmentation = "1.13.3"
url = { version = "2.5.8", features = ["serde"] }
utoipa = { version = "5.5.0", features = ["axum_extras", "url", "uuid", "time"], optional = true }
uuid = { version = "1.24.1", features = ["serde", "v7"] }
validator = { version = "0.20.0", features = ["derive"], optional = true }

[features]
serde = ["dep:serde", "dep:serde_json"]
utoipa = ["dep:utoipa"]
validator = ["dep:validator", "serde"]
str0m = ["dep:str0m"]
feat_forward_threads = []
feat_message_move = []
feat_message_forwarding = []
feat_interaction_reaction = []
feat_interaction_status = []
feat_redex_dependency_graph = []
feat_redex_dependency_advisories = ["feat_redex_dependency_graph"]
feat_e2ee = []
feat_tag_reactions = []
voice_application = []
voice_sendfile = []
ptr_arc = []
ptr_rc = []
ptr_box = []

default = [
  "utoipa",
  "validator",
  "feat_interaction_reaction",
  "str0m",
  "ptr_box",
]
