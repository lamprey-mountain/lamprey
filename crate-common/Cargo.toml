[package]
name = "lamprey-common"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true

[dependencies]
base64 = { workspace = true }
bitflags = { workspace = true, features = ["serde"] }
bytes = { workspace = true, features = ["serde"] }
ed25519-dalek = { workspace = true }
futures = { workspace = true }
headers = { workspace = true }
http = { workspace = true }
http-body = "1.1.0"
http-body-util = "0.1.5"
jsonwebkey = { workspace = true }
lamprey-macros = { workspace = true }
mediatype = { workspace = true, features = ["serde"] }
pastey = "0.2.3"
percent-encoding = { workspace = true }
rand = "0.10.3"
regex = { workspace = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
serde_urlencoded = { workspace = true }
str0m = { workspace = true, optional = true }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = { workspace = true }
time = { workspace = true, features = ["formatting", "macros", "parsing", "serde"] }
unicode-properties = { workspace = true }
unicode-segmentation = { workspace = true }
url = { workspace = true, features = ["serde"] }
utoipa = { workspace = true, features = ["axum_extras", "url", "uuid", "time"], optional = true }
uuid = { workspace = true, features = ["serde", "v7"] }
validator = { workspace = true, features = ["derive"], optional = true }

[features]
serde = ["dep:serde", "dep:serde_json"]
utoipa = ["dep:utoipa"]
validator = ["dep:validator", "serde"]
str0m = ["dep:str0m"]
feat_forward_threads = []
feat_message_move = []
feat_message_forwarding = []
feat_interaction_reaction = []
feat_interaction_status = []
feat_redex_dependency_graph = []
feat_redex_dependency_advisories = ["feat_redex_dependency_graph"]
feat_e2ee = []
feat_tag_reactions = []
voice_application = []
voice_sendfile = []
ptr_arc = []
ptr_rc = []
ptr_box = []

default = [
  "utoipa",
  "validator",
  "feat_interaction_reaction",
  "str0m",
  "ptr_box",
]
