[package]
name = "kerosene-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
http = "1.5.0"
lamprey = { package = "lamprey-common", version = "0.1.1", path = "../crate-common" }
lamprey-backend-core = { version = "0.1.1", path = "../crate-backend-core" }
opentelemetry = "0.30.0"
opentelemetry-otlp = { version = "0.30.0", features = ["grpc-tonic", "logs", "metrics", "reqwest", "tokio", "tracing", "trace"], default-features = false }
opentelemetry_sdk = { version = "0.30.0", features = ["rt-tokio", "tokio"] }
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-opentelemetry = "0.31.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
