[package]
name = "kerosene-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true

[dependencies]
async-trait = { workspace = true }
axum = { workspace = true }
bitflags = { workspace = true }
bytes = { workspace = true, features = ["serde"] }
crc32fast = { workspace = true }
http = { workspace = true }
ipnet = { workspace = true, features = ["serde"] }
lamprey = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true, features = ["grpc-tonic", "logs", "metrics", "trace"] }
opentelemetry_sdk = { workspace = true, features = ["rt-tokio", "tokio"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["process"] }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
unicode-properties = { workspace = true }
unicode-segmentation = { workspace = true }
url = { workspace = true }
utoipa = { workspace = true, features = ["axum_extras", "url", "uuid"] }
uuid = { workspace = true }
