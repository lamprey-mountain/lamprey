[package]
name = "kerosene-rest"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true

[dependencies]
axum = { workspace = true, features = ["macros", "multipart"] }
bytes = { workspace = true, features = ["serde"] }
common = { workspace = true, features = ["utoipa", "validator"] }
futures = { workspace = true }
headers = { workspace = true }
http = { workspace = true }
kerosene-core = { workspace = true }
lamprey-backend-core = { workspace = true }
lamprey-backend-services = { package = "kerosene-services", version = "0.1.1", path = "../kerosene-services" } # TODO: rename imports
lamprey-macros = { workspace = true }
lamprey-unfurl = { workspace = true }
multer = { workspace = true }
percent-encoding = { workspace = true }
rmp-serde = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true }
serde_urlencoded = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tower-http = { workspace = true, features = ["catch-panic", "cors", "limit", "propagate-header", "sensitive-headers", "trace"] }
tracing = { workspace = true }
url = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
validator = { workspace = true }
