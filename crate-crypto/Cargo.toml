[package]
name = "lamprey-crypto"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aes-gcm = "0.11.0"
ed25519-dalek = { workspace = true }
getrandom = { version = "0.2.17" }
# TODO: common refuses to compile without a random mishmash of features, i should clean up that code
lamprey = { workspace = true, default-features = false, features = ["validator", "serde", "utoipa", "ptr_box", "feat_e2ee" ] }
openmls = { version = "0.9.2", features = ["openmls_rust_crypto"] }
openmls_basic_credential = "0.6.0"
openmls_rust_crypto = "0.6.0"
postcard = { workspace = true, features = ["use-std"] }
rand = "0.10.2"
serde = { workspace = true, features = ["derive"] }
serde-wasm-bindgen = { workspace = true, optional = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tsify = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["serde", "v7", "js"] }
getrandom = { version = "0.2.17", features = ["js"] }
openmls = { version = "0.9.2", features = ["js"] }

[features]
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen", "dep:tsify"]
std = [] # TODO: no_std support
default = ["std", "wasm"]
sync = []
