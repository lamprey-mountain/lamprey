[package]
name = "lamprey-backend"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true

[[bin]]
name = "lamprey"
path = "src/main.rs"

[dependencies]
async-nats = { workspace = true }
async-tempfile = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true, features = ["macros", "ws", "multipart"] }
axum-extra = { workspace = true, features = ["typed-header"] }
backtrace-on-stack-overflow = "0.3.0"
base32 = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true, features = ["mmap"] }
bytes = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
clap = { workspace = true, features = ["derive"] }
common = { workspace = true, features = ["utoipa", "validator"] }
constant_time_eq = { workspace = true }
csscolorparser = { workspace = true }
dashmap = { workspace = true }
decancer = { workspace = true }
dotenvy = { workspace = true }
ece = { workspace = true }
ed25519-dalek = { workspace = true, features = ["rand_core"] }
figment = { workspace = true, features = ["env", "toml"] }
flate2 = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }
headers = { workspace = true }
http = { workspace = true }
httpdate = { workspace = true }
im = { workspace = true }
image = { workspace = true, features = ["avif"] }
infer = { workspace = true }
jsonwebkey = { workspace = true, features = ["generate", "pkcs-convert"] }
jsonwebtoken = { workspace = true, features = ["rust_crypto"] }
kameo = { workspace = true }
kerosene-core = { workspace = true }
kerosene-rest = { workspace = true, features = ["frontend"] }
kerosene-services = { workspace = true }
kerosene-sync = { workspace = true }
lamprey-backend-core = { workspace = true }
lamprey-backend-data-postgres = { workspace = true }
lamprey-macros = { workspace = true }
lamprey-markdown = { workspace = true }
lamprey-script = { workspace = true }
lamprey-unfurl = { workspace = true }
lettre = { workspace = true, features = ["builder", "pool", "smtp-transport", "tokio1-rustls-tls"] }
matchit = {version = "0.9.2", optional = true}
maxminddb = { workspace = true }
mediatype = { workspace = true, features = ["serde"] }
minijinja = "3.0.5"
moka = { workspace = true, features = ["future"] }
multer = { workspace = true }
nanoid = "0.5.0"
once_cell = { workspace = true }
opendal = { workspace = true, features = ["services-s3", "services-fs"] }
opentelemetry = { workspace = true }
opentelemetry-instrumentation-tower = { workspace = true }
opentelemetry-otlp = { workspace = true, features = ["grpc-tonic", "logs", "metrics", "trace"] }
opentelemetry_sdk = { workspace = true, features = ["rt-tokio", "tokio"] }
p256 = { workspace = true, features = ["pkcs8"] }
pastey = "0.2.3"
prometheus = { workspace = true, features = ["process"] }
regex = { workspace = true }
reqwest = { workspace = true, features = ["rustls", "json"] }
rmp-serde = { workspace = true }
rrule = { workspace = true }
rust-argon2 = { workspace = true }
rustls = { workspace = true, features = ["ring"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true }
serde_urlencoded = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "postgres", "uuid", "time", "ipnetwork"] }
strum = { version = "0.28.0", features = ["derive"] }
subtle = { workspace = true }
tantivy = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true, features = ["serde"] }
tokio = { workspace = true, features = ["macros", "process", "rt-multi-thread", "signal"] }
tokio-stream = { workspace = true, features = ["sync"] }
tokio-util = { workspace = true, features = ["compat"] }
totp-rs = { workspace = true }
tower-http = { workspace = true, features = ["catch-panic", "cors", "limit", "propagate-header", "sensitive-headers", "trace"] }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
url = { workspace = true, features = ["serde"] }
utoipa = { workspace = true, features = ["axum_extras", "url", "uuid"] }
utoipa-axum = { workspace = true }
uuid = { workspace = true, features = ["v7", "serde", "v4", "fast-rng", "macro-diagnostics"] }
validator = { workspace = true }
wtransport = { workspace = true, optional = true }
yrs = { workspace = true, features = ["sync"] }

[build-dependencies]
vergen-gitcl = { version = "10.0.3", features = ["build", "cargo", "rustc"] }

[features]
default = ["webtransport"]
debug = []
e2ee = []
webtransport = ["dep:wtransport", "dep:matchit", "kerosene-services/webtransport", "kerosene-rest/webtransport"]
