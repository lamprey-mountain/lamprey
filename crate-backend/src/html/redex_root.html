<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>???</title>
		<style>
		:root {
			--font-default:
				"Atkinson Hyperlegible",
				Inter,
				system-ui,
				Avenir,
				Helvetica,
				Arial,
				sans-serif;
			--font-mono: "Iosevka Zesty", "Courier New", Courier, monospace;
			--color-fg1: 100% 0 0;
			--color-fg2: 94.9% 0 0;
			--color-fg4: 84.5% 0 0;
			--color-bg1: 17% 0.008 229.4;
			--color-bg1-5: 18.84% 0.009 229.4;
			--color-bg2: 22.3% 0.01 234.2;
			--color-sep-300: 27.83% 0.016 219.8;
			--color-link-500: 71.6% 0.15 299.2;

			color-scheme: dark;
			font: 16px/1.3 var(--font-default);
			color: oklch(var(--color-fg2));
			background-color: oklch(var(--color-bg1));
			text-rendering: optimizeLegibility;
			-webkit-font-smoothing: antialiased;
			-moz-osx-font-smoothing: grayscale;
		}

		::selection {
			background-color: #3fa9c988;
		}

		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
		}

		main {
			max-width: 34rem;
			margin: 1rem;
			padding: 1.5rem;
			background-color: oklch(var(--color-bg2));
			border: solid 1px oklch(var(--color-sep-300));
			border-radius: 4px;
		}

		h1 {
			margin: 0 0 0.75rem;
			font-size: 1.5rem;
			color: oklch(var(--color-fg1));
		}

		p {
			margin: 0.5rem 0;
		}

		code {
			padding: 2px 4px;
			border-radius: 2px;
			background-color: oklch(var(--color-bg1-5));
			color: oklch(var(--color-fg4));
			font-family: var(--font-mono);
		}

		a {
			color: oklch(var(--color-link-500));
			cursor: pointer;
			border-radius: 2px;
		}

		a:hover,
		a:focus-visible {
			text-decoration: underline;
		}
		</style>
	</head>
	<body>
		<main>
			<h1>Sup!</h1>
			<p>This domain serves redexes. If you don't know what that means, I wouldn't worry about it.</p>
			<p>Either way, you probably meant to go to <a href="{{ html_url }}">the main entrypoint</a>.</p>
		</main>
	</body>
</html>
